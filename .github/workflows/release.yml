name: Release
# When CI passes on main and CHANGELOG.md's newest version has no release
# yet, publishes the disk image CI built and tested for exactly that commit
# (universal, versioned, through the self-test) as LaserdotPlus-<version>.dmg —
# no second build, so a release follows the passing check within a minute.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 0.1.0'
        required: true
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  decide:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      sha: ${{ steps.v.outputs.sha }}
      go: ${{ steps.v.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ github.event.inputs.version }}"
          if [ -z "$v" ]; then v=$(awk '/^## [0-9]+\.[0-9]+\.[0-9]+/ {print $2; exit}' CHANGELOG.md); fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          go=true
          if [ -z "$v" ] || { [ "${{ github.event_name }}" = workflow_run ] && gh release view "v$v" -R "${{ github.repository }}" >/dev/null 2>&1; }; then go=false; fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
  release:
    needs: decide
    if: needs.decide.outputs.go == 'true'
    # No second build: CI's app job built, tested (self-test, update swap) and
    # kept this commit's universal disk image; it is published as it is.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.decide.outputs.sha }}
      - name: The disk image CI tested
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=${{ needs.decide.outputs.sha }}
          for id in ${{ github.event.workflow_run.id }} $(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$sha&status=success&per_page=20" --jq '.workflow_runs[].id'); do
            if gh run download "$id" -R "${{ github.repository }}" -n release-dmg -D dl 2>/dev/null && [ -f dl/LaserdotPlus.dmg ]; then
              echo "from CI run $id"; break
            fi
          done
          test -f dl/LaserdotPlus.dmg || { echo "::error::no tested disk image for $sha"; exit 1; }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${{ needs.decide.outputs.version }}
          { awk -v h="## $v" '$0 == h {on=1; next} /^## / {on=0} on' CHANGELOG.md; echo
            echo "Open the disk image and drag Laserdot+ to Applications. The first time, right-click Laserdot+ → Open (the app is not notarized). From 0.1.5 on, Laserdot+ updates itself: Install and Relaunch when it says a newer version is out."; } > notes.md
          # Also under a fixed name: the README links to
          # releases/latest/download/LaserdotPlus.dmg, always the newest.
          cp dl/LaserdotPlus.dmg "LaserdotPlus-$v.dmg"
          cp dl/LaserdotPlus.dmg LaserdotPlus.dmg
          gh release create "v$v" "LaserdotPlus-$v.dmg" LaserdotPlus.dmg --target "${{ needs.decide.outputs.sha }}" --title "Laserdot+ $v" --notes-file notes.md \
            || gh release upload "v$v" "LaserdotPlus-$v.dmg" LaserdotPlus.dmg --clobber
